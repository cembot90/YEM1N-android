name: Tests

on:
  push:
    branches: [main, entwicklung]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lizenzen annehmen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit-Tests und Debug-Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Expected|What went wrong" -A2 build.log | head -40 | while IFS= read -r zeile; do
            echo "::error::${zeile}"
          done
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-Tests
        run: cd server && npm test
