name: Tests

on:
  push:
    branches: [main, entwicklung]
  pull_request:

# Die Läufe brauchen nur Lesezugriff auf den Code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lizenzen annehmen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit-Tests und Debug-Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Prüfung der Bibliotheken auf 16-KB-Seiten (Google Play)
        if: always()
        run: |
          set +e
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$apk" ] || { echo "::warning::Kein Debug-APK gefunden, 16-KB-Prüfung übersprungen"; exit 0; }
          mkdir -p /tmp/apkprobe && cd /tmp/apkprobe && unzip -q -o "$apk" 'lib/*'
          schlecht=0
          for f in lib/arm64-v8a/*.so lib/x86_64/*.so; do
            [ -f "$f" ] || continue
            ausr=$(readelf -lW "$f" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            ok=1; for a in $ausr; do [ $((a)) -ge 16384 ] || ok=0; done
            if [ $ok = 0 ]; then schlecht=1; echo "::error::Nicht auf 16 KB ausgerichtet: $f (Ausrichtung: $ausr)"; fi
          done
          zip=$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          if [ -n "$zip" ]; then
            "$zip" -c -P 16 -v 4 "$apk" | grep -i "BAD" | head -10 | while IFS= read -r z; do echo "::warning::zipalign: $z"; done
          fi
          if [ $schlecht = 0 ]; then echo "Alle Bibliotheken sind auf 16 KB ausgerichtet."; else exit 1; fi
      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Expected|What went wrong" -A2 build.log | head -40 | while IFS= read -r zeile; do
            echo "::error::${zeile}"
          done
      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/

  # Nur für die Design-Arbeit: Bildschirmfotos der wichtigsten Seiten (Robolectric und Roborazzi, ohne Emulator).
  # "vorher" nimmt den App-Code vor der Design-Arbeit, damit sich beide Stände vergleichen lassen.
  fotos:
    if: github.ref_name == 'design-fable'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stand: [nachher, vorher]
    env:
      VORHER: "b002356"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lizenzen annehmen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Alten Stand der App holen
        if: matrix.stand == 'vorher'
        run: |
          git rm -rq app/src/main
          git checkout "$VORHER" -- app/src/main
      - name: Fotos machen
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest -Pfotos --tests "*BildschirmfotoTest" --no-daemon --console=plain > fotos.log 2>&1
          rc=$?
          tail -n 40 fotos.log
          if [ $rc -ne 0 ]; then
            grep -E "^e: |FAILED|Exception|Error|What went wrong|Caused by" -A3 fotos.log | head -60 | cut -c1-300 | while IFS= read -r zeile; do
              echo "::error::${zeile}"
            done
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              grep -E "Exception|Error|Caused by" "$f" | head -25 | cut -c1-300 | while IFS= read -r zeile; do
                echo "::error::${zeile}"
              done
            done
          fi
          ls -la app/build/fotos 2>/dev/null | head -80
          exit $rc
      - name: Fotos hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-${{ matrix.stand }}
          path: |
            app/build/fotos/
            fotos.log
          if-no-files-found: warn

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server-Tests
        run: cd server && npm test
